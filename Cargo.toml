[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
agent-control-core = { path = "crates/core" }
agent-control-mcp = { path = "crates/mcp" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
schemars = { version = "1.0", features = ["chrono04"] }

anyhow = "1"

rusqlite = { version = "0.41", features = ["bundled"] }

sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

globset = "0.4"
regex = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

rmcp = { version = "3.9", default-features = false }
axum = "0.8"

gpui-kit = "0.9"

dirs = "7"
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true